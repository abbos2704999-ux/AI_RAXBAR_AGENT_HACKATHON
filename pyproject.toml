[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-raxbar-agent"
version = "0.1.0"
description = "Deterministic, public-safe foundation for an autonomous critical-infrastructure operations agent (hackathon Batch 1)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Batch 2 agent layer: Google ADK (agent/tool orchestration) + google-genai
# (Gemini client used by ADK's Gemini model backend). Not required for the
# Batch 1 deterministic foundation -- only for building/running/testing the
# agent layer, which is why they live in optional extras rather than
# `dependencies`.
agent = ["google-adk>=1.0.0", "google-genai>=1.0.0"]
# Batch 4 persistence adapter: only needed to construct a real
# `firestore_repository.build_live_client()` against actual Google Cloud
# Firestore. Not required to import/use `firestore_repository.py` itself
# (that module lazy-imports this package only inside `build_live_client`),
# and not required by the offline test suite, which exercises the adapter
# against `tests/fakes.py::FakeFirestoreClient` instead.
firestore = ["google-cloud-firestore>=2.0.0"]
dev = ["pytest>=7.0", "google-adk>=1.0.0", "google-genai>=1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
